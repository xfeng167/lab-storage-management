# Development only. Production uses docker-compose.yaml with external secrets and
# does not publish MySQL or database-admin ports.
services:
  mysql:
    image: mysql:8.0
    container_name: lab-storage-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lab_storage_db
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./init-dev.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

  adminer:
    image: adminer:latest
    container_name: lab-storage-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_dev_data:
